# Repo: FirelyTeam/firely-validator-api
# File: build/azure-pipelines.yml
name: $(date:yyyyMMdd)$(rev:.r)
resources:
  repositories:
  - repository: templates
    type: github
    name: FirelyTeam/azure-pipeline-templates
    endpoint: FirelyTeam
    ref: refs/tags/v1
variables:
  - group: CodeSigning
  - group: APIKeys
  - template: variables.yml

pool: 
  vmImage: $(vmImage)

trigger:
  branches:
    include:
    - develop
    - develop-sdk6
    - release/*
    - hotfix/*
    - refs/tags/v*
  batch: True

stages:
- stage: build
  jobs:
  - template: build.yml@templates  # Template reference
    parameters:
      dotNetCoreVersion: $(DOTNET_CORE_SDK)
      checkoutSubmodules: true
      ${{ if not(startswith(variables['Build.SourceBranch'], 'refs/tags/v')) }}:  # 'normal' build 
        useVersionSuffix: true
      ${{ else }}:  # release mode
        useVersionSuffix: false
      propsFile: 'firely-validator-api.props'
      packageArtifacts: true
      restoreDependencies: true
      nuGetServiceConnections: GitHubPackageGetFeed
      nuGetSources: --source https://nuget.pkg.github.com/FirelyTeam/index.json
      testProjects: '**/*Tests*/*Tests.csproj'
      signingKeyFileName: 'FirelyValidator.snk' 
      filesForSigning: '$(Build.SourcesDirectory)\src\Firely.Fhir.Validation*\bin\*\*\Firely.Fhir.Validation*.dll'
      certificateProfileName: 'FirelyCodeSigning'
      trustedSigningAccountEndpoint: 'https://weu.codesigning.azure.net/'
      trustedSigningAccountName: 'FirelyCodeSigning'
      azureServiceConnection: 'AzureTrustedSigningPrincipal'
      pool: 
        vmImage: $(vmImage)
      preBuildSteps:
      - template: updatePackageVersion.yml@templates
        parameters:
          packageName: 'Hl7.Fhir.Base'
          packageVersion: $(firelySDKVersion)
          propertyFilePath: 'firely-validator-api.props'
          packageProperty: 'FirelySdkVersion'
          nuGetServiceConnections: GitHubPackageGetFeed
          displayName: 'Update Firely SDK version'
      - template: updatePackageVersion.yml@templates
        parameters:
          packageName: 'Hl7.Fhir.Base'
          packageVersion: $(firelySDKVersion)
          propertyFilePath: 'firely-validator-api-tests.props'
          packageProperty: 'FirelySdkVersion'
          nuGetServiceConnections: GitHubPackageGetFeed
          displayName: 'Update Firely SDK version for the tests'
  
      
- stage: deploy_gitHub
  displayName: Deploy packages to GitHub
  dependsOn: build
  condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest')) # not a PR
  jobs:
  - deployment: github
    displayName: GitHub Packages
    environment: GitHub
    strategy:
      runOnce:
        deploy:
            steps:
            - template: push-nuget-package.yml@templates  # Template reference
              parameters:
                artifact: NuGetPackages
                source: https://nuget.pkg.github.com/FirelyTeam/index.json
                apiKey: $(GITHUB_PACKAGES_APIKEY)

- stage: deployToNuget
  dependsOn: deploy_gitHub
  displayName: Deploy packages to NuGet
  condition: and(succeeded(), startswith(variables['Build.SourceBranch'], 'refs/tags/v'))
  jobs:
  - deployment: NuGet    
    displayName: Publish to Nuget      
    environment: NuGet
    strategy:
      runOnce:
        deploy:
          steps:
          - template: push-nuget-package.yml@templates
            parameters:
              artifact: 'NuGetPackages'
              source: https://api.nuget.org/v3/index.json
              apiKey: $(NUGET_APIKEY)
